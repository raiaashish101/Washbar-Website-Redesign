# BEGIN WASH BAR V4 MANAGED BLOCK
# Merge into a privately reviewed root .htaccess; never overwrite cPanel PHP/auth rules blindly.
RewriteEngine On

# Owner-confirmed legacy inventory, 29 October. Skip ONLY the ten V4 rules below;
# existing rules after this managed block still apply to these preserved paths.
# Do not change DirectoryIndex globally: smart/ and user/ may be independent PHP apps.
# THE_REQUEST stays unchanged through internal legacy rewrites.
RewriteCond %{THE_REQUEST} \s/+(?:(?:\.well-known|cgi-bin|css|img|js|preview-v2|smart|user|v4-enquiry-test)(?:/|[?\s])|(?:google4cba3a7518b65e43\.html|favicon\.ico|dpindex\.php|test\.php|header2?\.php|footer\.php|\.DS_Store|\.ftpquota|\.htaccess(?:[._][^?\s]*)?)(?:[?\s]))
RewriteRule ^ - [S=10]

# Proposed for Apache-terminated TLS; confirm existing/proxy rules before approval.
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} !^wash-bar\.com\.au$ [NC]
RewriteRule ^ https://wash-bar.com.au%{REQUEST_URI} [R=301,L,NE]

# These legacy routes were observed on 29 October 2026; no blanket homepage redirect.
RewriteCond %{THE_REQUEST} \s/+index\.php(?:[?\s]) [NC]
RewriteRule ^index\.php$ https://wash-bar.com.au/ [R=301,L,NE]
RewriteCond %{THE_REQUEST} \s/+story\.php(?:[?\s]) [NC]
RewriteRule ^story\.php$ https://wash-bar.com.au/our-story/ [R=301,L,NE]
RewriteCond %{THE_REQUEST} \s/+tips\.php(?:[?\s]) [NC]
RewriteRule ^tips\.php$ https://wash-bar.com.au/blog/ [R=301,L,NE]

# Redirect explicit index.html requests, not Apache's internal DirectoryIndex resolution.
RewriteCond %{THE_REQUEST} \s/+(.*/)?index\.html(?:[?\s]) [NC]
RewriteRule ^(.*)index\.html$ https://wash-bar.com.au/$1 [R=301,L,NE]

# Only the thirteen V4 routes use these explicit static indexes; legacy PHP stays in place.
RewriteRule ^(our-story|blog|locations/(?:north-melbourne|flemington|west-melbourne|fitzroy|ascot-vale|east-windsor)|blog/(?:how-to-remove-common-laundry-stains|self-service-vs-wash-and-fold|airbnb-laundry-turnover-guide|how-often-to-wash-sheets-towels-gym-clothes))$ https://wash-bar.com.au/$1/ [R=301,L,NE]
RewriteRule ^$ index.html [END]
RewriteRule ^(our-story|blog|locations/(?:north-melbourne|flemington|west-melbourne|fitzroy|ascot-vale|east-windsor)|blog/(?:how-to-remove-common-laundry-stains|self-service-vs-wash-and-fold|airbnb-laundry-turnover-guide|how-often-to-wash-sheets-towels-gym-clothes))/$ $1/index.html [END]
RewriteRule ^(?:assets|api)/ - [END]
RewriteRule ^(?:index\.html|style\.css|script\.js|robots\.txt|sitemap\.xml)$ - [END]
# END WASH BAR V4 MANAGED BLOCK
